[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quicksnip"
version = "1.0.0"
description = "A fast, terminal-based code snippet manager"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyperclip>=1.8",
]

[project.scripts]
quicksnip = "quicksnip.cli:cli"
snip = "quicksnip.cli:cli"

[tool.setuptools.packages.find]
include = ["quicksnip*"]
